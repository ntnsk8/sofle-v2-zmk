# Ativa o Display OLED
CONFIG_ZMK_DISPLAY=y

# Ativa os Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ATIVAÇÃO DO RGB (Removi o # para funcionar)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Garante que o OLED não apague quando você desligar o RGB
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_EXT_POWER=y

# Configurações do ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
